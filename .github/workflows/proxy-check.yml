name: AgentRouter Proxy Check

on:
  workflow_dispatch:

jobs:
  proxy-check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Install mihomo
        env:
          PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
          PROXY_TEST_URL: https://www.google.com/generate_204
          MIHOMO_VERSION: v1.19.27
          PROXY_REQUIRED: true
        run: bash scripts/setup_mihomo_proxy.sh

      - name: Compare proxy access
        env:
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
        run: |
          set -o pipefail
          echo '=== ACTIONS_PROXY_IP ==='
          curl -sS --max-time 20 -x "$CHECKIN_PROXY_URL" https://api.ipify.org
          echo
          echo '=== ACTIONS_AGENTROUTER_HEADERS ==='
          curl -sS -L --max-time 20 -D /tmp/agentrouter-headers \
            -o /tmp/agentrouter-login.html -x "$CHECKIN_PROXY_URL" \
            https://agentrouter.org/login
          sed -n '1,20p' /tmp/agentrouter-headers
          echo '=== ACTIONS_AGENTROUTER_MARKERS ==='
          grep -Eai 'Access Verification|Please slide|sign.?in|password|login' \
            /tmp/agentrouter-login.html | head -n 10 || true

      - name: Report selected proxy node
        run: |
          echo '=== MIHOMO_SELECTED_NODE ==='
          curl -fsS --max-time 10 http://127.0.0.1:9090/proxies/CHECKIN | jq -r '.now // "unknown"'

      - name: Stop mihomo
        if: always()
        run: bash scripts/stop_mihomo_proxy.sh
